<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Arka plan -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Sokaklar -->
  <g stroke="#ccc" stroke-width="20">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="500" x2="700" y2="500"/>
    <line x1="200" y1="50" x2="200" y2="550"/>
    <line x1="400" y1="50" x2="400" y2="550"/>
    <line x1="600" y1="50" x2="600" y2="550"/>
  </g>

  <!-- Sokak isimleri -->
  <g fill="#666" font-family="Arial" font-size="14">
    <text x="350" y="90">5th Avenue</text>
    <text x="350" y="290">Madison Avenue</text>
    <text x="350" y="490">Park Avenue</text>
    <text transform="rotate(-90 190 300)" x="190" y="300">E 51st Street</text>
    <text transform="rotate(-90 390 300)" x="390" y="300">E 52nd Street</text>
    <text transform="rotate(-90 590 300)" x="590" y="300">E 53rd Street</text>
  </g>

  <!-- Emlak ofisi lokasyonu -->
  <g transform="translate(400,300)">
    <circle r="15" fill="#e74c3c"/>
    <circle r="8" fill="#c0392b"/>
  </g>

  <!-- Lokasyon etiketi -->
  <g transform="translate(420,290)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="white" stroke="#666"/>
    <text x="10" y="25" font-family="Arial" font-size="12" fill="#333">
      Lue Properties
    </text>
  </g>

  <!-- Yakındaki yerler -->
  <g fill="#999" font-family="Arial" font-size="11">
    <text x="220" y="200">Central Park</text>
    <text x="520" y="400">Grand Central</text>
    <text x="180" y="350">Times Square</text>
  </g>

  <!-- Pusula -->
  <g transform="translate(700,500)">
    <circle r="20" fill="white" stroke="#666"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="14">N</text>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#666" stroke-width="2"/>
  </g>

  <!-- Ölçek çubuğu -->
  <g transform="translate(100,550)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#666" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="12">100m</text>
  </g>
</svg>
